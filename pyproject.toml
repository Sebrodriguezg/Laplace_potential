[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campo_estatico_mdf"
version = "0.1.0"
authors = [
    { name="Jules", email="jules@example.com" },
]
description = "Un paquete para resolver el campo electrostático 2D con el Método de Diferencias Finitas."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pytest",
]

[tool.setuptools]
packages = ["campo_estatico_mdf"]
